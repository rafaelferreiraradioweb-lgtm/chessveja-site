<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laudo VIP - Chessveja</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #2c3e50; }
        input[type="password"], input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background-color: #2c3e50; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background-color: #1a252f; }
        .btn-print { background-color: #2ecc71; }
        .btn-print:hover { background-color: #27ae60; }
        #laudo-area { margin-top: 30px; display: none; }
        #cabecalho-pdf { display: none; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
        
        /* A MÁGICA DA IMPRESSÃO DO PDF */
        @media print {
            body { background-color: white; padding: 0; }
            #senha-section, #controls-section, button { display: none !important; }
            .container { box-shadow: none; border: none; max-width: 100%; padding: 0; }
            #cabecalho-pdf { display: block; }
            #laudo-area { display: block; margin-top: 0; }
            @page { margin: 2cm; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="senha-section">
        <h2>🔒 Acesso Restrito - Diagnóstico VIP</h2>
        <input type="password" id="senha" placeholder="Digite a senha de acesso">
        <button onclick="verificarSenha()">Entrar</button>
    </div>

    <div id="controls-section" style="display: none;">
        <h2>♟️ Chessveja analisando suas ultimas 10 partidas rapidas no lichess</h2>
        <p>Este sistema puxa silenciosamente as últimas 10 partidas rápidas do jogador e gera um dossiê técnico.</p>
        <input type="text" id="nick" placeholder="Digite o nick do Lichess do cliente">
        <button onclick="gerarDiagnostico()">Gerar Laudo Técnico (Pode levar até 30s)</button>
        <div id="status" style="margin-top:15px; font-weight:bold; color:#e74c3c;"></div>
    </div>

    <div id="cabecalho-pdf">
        <h1>CHESSVEJA - LAUDO TÉCNICO OFICIAL</h1>
        <p><strong>Avaliador:</strong> Prof. Rafael Ferreira</p>
    </div>

    <div id="laudo-area">
        <div id="resultado-texto"></div>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Laudo em PDF</button>
    </div>
</div>

<script>
    function verificarSenha() {
        const senha = document.getElementById('senha').value;
        if (senha === 'rafaelpro') {
            document.getElementById('senha-section').style.display = 'none';
            document.getElementById('controls-section').style.display = 'block';
        } else {
            alert('Senha incorreta!');
        }
    }

    async function gerarDiagnostico() {
        const nick = document.getElementById('nick').value.trim();
        const statusDiv = document.getElementById('status');
        const laudoArea = document.getElementById('laudo-area');
        const resultadoTexto = document.getElementById('resultado-texto');

        if (!nick) {
            statusDiv.innerText = "Por favor, digite um nick.";
            return;
        }

        statusDiv.innerText = "1/2: Puxando as 10 últimas partidas do Lichess... 🎣";
        laudoArea.style.display = 'none';

        try {
            const lichessRes = await fetch(`https://lichess.org/api/games/user/${nick}?max=10&perfType=rapid`);
            
            if (!lichessRes.ok) throw new Error("Nick não encontrado ou sem partidas rápidas.");
            const pgns = await lichessRes.text();

            if (!pgns) {
                statusDiv.innerText = "Este jogador não tem partidas rápidas recentes.";
                return;
            }

            statusDiv.innerText = "2/2: Inteligência Artificial redigindo o Laudo Técnico... ⏳";

            const apiRes = await fetch('/api/diagnose', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pgns, nick })
            });

            const data = await apiRes.json();
            
            if (data.analysis) {
                resultadoTexto.innerHTML = data.analysis;
                statusDiv.innerText = "Laudo gerado com sucesso!";
                laudoArea.style.display = 'block';
            } else {
                statusDiv.innerText = "Erro ao gerar laudo com a IA.";
            }

        } catch (error) {
            statusDiv.innerText = "Erro: " + error.message;
        }
    }
</script>

</body>
</html>
