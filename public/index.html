<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessveja - Aulas de Xadrez em Maceió</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>

    <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_d29uZHJvdXMtc3RhbGxpb24tNy5jbGVyay5hY2NvdW50cy5kZXYk"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
    ></script>
</head>
<body>

    <header>
        <nav>
            <a href="#inicio" class="logo">
                <img src="minha_logo.png" alt="Logo do Chessveja" style="height: 70px;">
            </a>
            <ul>
                <li><a href="portfolio-chessveja.pdf" target="_blank">Portfólio</a></li>
                <li><a href="#analisador">Analisador AI</a></li>
                
                <li id="auth-container">
                    <span style="color: #666;">Carregando...</span>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="analisador">
            <h2>Analisador Premium (OpenAI)</h2>
            <div class="analyzer-layout">
                <div class="board-column">
                    <div id="board" class="chessboard"></div>
                </div>
                <div class="analysis-column">
                    <h3>Configurações da Análise</h3>
                    <div class="options-grid">
                         <select id="analysis-color"><option value="brancas">Brancas</option><option value="pretas">Pretas</option></select>
                         <select id="analysis-level"><option value="iniciante">Iniciante</option><option value="intermediario">Intermediário</option></select>
                         <select id="analysis-tone"><option value="tecnico">Técnico</option><option value="motivacional">Motivacional</option></select>
                    </div>

                    <textarea id="pgn-input" placeholder="Cole o PGN da sua partida aqui..." style="width: 100%; height: 100px; margin-top: 10px;"></textarea>
                    
                    <button id="analyze-button" style="margin-top: 10px; padding: 10px 20px; cursor: pointer;">Analisar com ChatGPT</button>
                    
                    <div id="gemini-output" class="gemini-box" style="margin-top: 20px; background: #f0f0f0; padding: 15px; border-radius: 8px;">
                        Aguardando análise...
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        window.addEventListener('load', async function () {
            await Clerk.load();
            const authContainer = document.getElementById('auth-container');
            
            if (Clerk.user) {
                // Se estiver logado, mostra a foto do usuário
                authContainer.innerHTML = '<div id="user-button"></div>';
                Clerk.mountUserButton(document.getElementById('user-button'));
            } else {
                // Se NÃO estiver logado, mostra botão Entrar
                authContainer.innerHTML = `
                    <button onclick="Clerk.openSignIn()" style="background:none; border:2px solid gold; color: gold; padding: 5px 15px; cursor: pointer; border-radius: 5px; font-weight: bold;">
                        Entrar
                    </button>`;
            }
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
